services:
  postgres:
    image: postgres:18-alpine
    container_name: platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-plateau}"
      POSTGRES_SERVICE_DATABASES: "${POSTGRES_SERVICE_DATABASES:-plateau_iam}"
      IAM_DATABASE_NAME: "${IAM_DATABASE_NAME:-plateau_iam}"
      IAM_DATABASE_ROLE: "${IAM_DATABASE_ROLE:-plateau_iam_app}"
      IAM_DATABASE_PASSWORD: "${IAM_DATABASE_PASSWORD:-plateau_iam_pwd}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d postgres",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 在 major-version 子目录存储数据，挂载父目录。
      - plateau-postgres-data:/var/lib/postgresql
    networks:
      - plateau-network

  postgres-provision:
    image: postgres:18-alpine
    container_name: platform_postgres_provision
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: "${POSTGRES_USER:-postgres}"
      PGPASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      PGDATABASE: postgres
      POSTGRES_SERVICE_DATABASES: "${POSTGRES_SERVICE_DATABASES:-plateau_iam}"
      IAM_DATABASE_NAME: "${IAM_DATABASE_NAME:-plateau_iam}"
      IAM_DATABASE_ROLE: "${IAM_DATABASE_ROLE:-plateau_iam_app}"
      IAM_DATABASE_PASSWORD: "${IAM_DATABASE_PASSWORD:-plateau_iam_pwd}"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/provision/create-databases.sh"]
    volumes:
      - ./manifests/scripts/postgres:/provision:ro
    networks:
      - plateau-network

  openfga-migrate:
    image: openfga/openfga:latest
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - migrate
      - --datastore-engine
      - postgres
      - --datastore-uri
      - "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-plateau}?sslmode=disable"
    networks:
      - plateau-network

  openfga:
    image: openfga/openfga:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      openfga-migrate:
        condition: service_completed_successfully
    command:
      - run
      - --datastore-engine
      - postgres
      - --datastore-uri
      - "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-plateau}?sslmode=disable"
    ports:
      - "127.0.0.1:${OPENFGA_HTTP_PORT:-18080}:8080"
      - "127.0.0.1:${OPENFGA_GRPC_PORT:-18081}:8081"
      - "127.0.0.1:${OPENFGA_PLAYGROUND_PORT:-3002}:3000"
    networks:
      - plateau-network

  consul:
    image: consul:1.15.4
    container_name: platform_consul
    restart: unless-stopped
    command:
      - agent
      - -server
      - -ui
      - -node=consul-server-1
      - -bootstrap-expect=1
      - -client=0.0.0.0
      - -data-dir=/consul/data
    healthcheck:
      test: ["CMD", "consul", "info"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    volumes:
      - plateau-consul-data:/consul/data
    networks:
      - plateau-network

  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: platform_jaeger
    restart: unless-stopped
    environment:
      JAEGER_LISTEN_HOST: 0.0.0.0
    ports:
      - "16686:16686"
    networks:
      - plateau-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: platform_otel_collector
    user: "0:0"
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    healthcheck:
      test:
        [
          "CMD",
          "/otelcol-contrib",
          "validate",
          "--config=/etc/otelcol/config.yaml",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./manifests/otel/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - audit-logs:/var/log/audit:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger
      - loki
    networks:
      - plateau-network

  loki:
    image: grafana/loki:latest
    container_name: platform_loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "16685:3100"
    volumes:
      - ./manifests/loki/loki.yaml:/etc/loki/config.yaml:ro
      - plateau-loki-data:/loki
    networks:
      - plateau-network

  prometheus:
    image: prom/prometheus:latest
    container_name: platform_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./manifests/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - plateau-prometheus-data:/prometheus
    networks:
      - plateau-network

  grafana:
    image: grafana/grafana:latest
    container_name: platform_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_METRICS_ENABLED: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - ./manifests/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./manifests/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - plateau-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - jaeger
    networks:
      - plateau-network

  traefik:
    image: traefik:v3.6
    container_name: platform_traefik
    restart: unless-stopped
    depends_on:
      consul:
        condition: service_healthy
    command:
      - --configFile=/etc/traefik/traefik.yaml
    ports:
      - "8080:80"
      - "8081:8080"
      - "8082:8082"
    volumes:
      - ./manifests/traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - plateau-network

  kafka:
    image: apache/kafka:latest
    container_name: platform_kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_CLUSTER_ID: "U3VyYW9LYWZrYUNsdXN0ZXI"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - plateau-kafka-data:/var/lib/kafka/data
    networks:
      - plateau-network

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: platform_clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: servora_audit
      CLICKHOUSE_USER: servora
      CLICKHOUSE_PASSWORD: servora_ch_pwd
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user servora --password servora_ch_pwd --query 'SELECT 1' >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - "18123:8123"
      - "19000:9000"
    volumes:
      - plateau-clickhouse-data:/var/lib/clickhouse
    networks:
      - plateau-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: platform_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP —— IAM 的 config 指向 mailpit:1025
      - "8025:8025"   # Web UI —— 本地点链接 http://localhost:8025
    networks:
      - plateau-network

  redis:
    image: redis:8.6.1-alpine
    container_name: iam_redis
    restart: unless-stopped
    command: redis-server --requirepass servora_redis_pwd --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "servora_redis_pwd", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - plateau-network

volumes:
  plateau-postgres-data:
  plateau-consul-data:
  plateau-loki-data:
  plateau-prometheus-data:
  plateau-grafana-data:
  plateau-kafka-data:
  plateau-clickhouse-data:
  redis-data:
  audit-logs:

networks:
  plateau-network:
